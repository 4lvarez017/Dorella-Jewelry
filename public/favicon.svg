<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="35%" stop-color="#E8C96B" />
      <stop offset="70%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7A2E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0A0909" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.65" />

  <!-- Dorella 'D' Monogram in Luxury Serif Style -->
  <text 
    x="50" 
    y="66" 
    font-family="'Cormorant Garamond', 'Georgia', 'Playfair Display', serif" 
    font-size="62" 
    font-weight="600" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    letter-spacing="0.05em">D</text>

  <!-- Sparkling luxury accent dot -->
  <circle cx="68" cy="30" r="3.2" fill="#FFE599" />
  <circle cx="68" cy="30" r="1.5" fill="#FFFFFF" />
</svg>
